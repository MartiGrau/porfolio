<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Onest";
        src: url("/node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #07060f; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="800"></canvas>
    <script src="lib.js"></script>
    <script src="scenes/agents.js"></script>
    <script src="scenes/rag.js"></script>
    <script src="scenes/vision.js"></script>
    <script src="scenes/mlops.js"></script>
    <script src="scenes/finetune.js"></script>
    <script src="scenes/strategy.js"></script>
    <script>
      const ctx = document.getElementById("c").getContext("2d")
      let scene = null
      window.initScene = async (name) => {
        await document.fonts.load('600 40px "Onest"')
        await document.fonts.ready
        scene = window.SCENES[name]
        if (!scene) throw new Error("unknown scene " + name)
        if (scene.setup) await scene.setup(ctx)
        return { duration: scene.duration }
      }
      window.renderAt = (t) => {
        ctx.save()
        scene.draw(ctx, t)
        ctx.restore()
      }
      // Motion blur: average `samples` sub-frames spread over `shutter` seconds.
      // Times wrap around the loop so the first frame blends with the last.
      const accum = document.createElement("canvas")
      accum.width = 1280
      accum.height = 800
      const actx = accum.getContext("2d")
      window.renderFrame = (t, samples = 1, shutter = 0) => {
        if (samples <= 1) {
          window.renderAt(t)
          return document.getElementById("c").toDataURL("image/png")
        }
        const T = scene.duration
        K.setFrameTime(t)
        for (let k = 0; k < samples; k++) {
          const tt = (((t + ((k + 0.5) / samples - 0.5) * shutter) % T) + T) % T
          window.renderAt(tt)
          actx.globalAlpha = 1 / (k + 1)
          actx.drawImage(ctx.canvas, 0, 0)
        }
        actx.globalAlpha = 1
        K.setFrameTime(null)
        return accum.toDataURL("image/png")
      }
    </script>
  </body>
</html>
